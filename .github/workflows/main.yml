name: Build Neural DJ APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add music scanner and permissions
        run: |
          mkdir -p android/app/src/main/java/com/neuraldj/app
          cp MainActivity.java MusicScannerPlugin.java StemSplitterPlugin.java android/app/src/main/java/com/neuraldj/app/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s#dependencies {#dependencies {\n    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'#" android/app/build.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#<application#<application android:largeHeap="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug; then ok=1; break; fi
            sleep 20
          done
          [ $ok = 1 ]

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neural DJ build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
